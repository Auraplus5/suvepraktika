<div class="container mat-elevation-z4">
  <mat-card>
    <mat-card-title>Books</mat-card-title>
    <mat-card-content>
      <div class="searchInput">
        <input #searchInput placeholder="Search by title..." (input)="onTitleInput(searchInput.value)" (blur)="suggestions = []"/>
        <ul *ngIf="suggestions.length > 0">
          <li *ngFor="let title of suggestions"
              (mousedown)="selectSuggestion(title)">
              {{ title }}
          </li>
        </ul>
      </div>
      <div>
        <select #statusSelect>
          <option *ngFor="let option of options" [value]="option">{{option}}</option>
        </select>
        <button (click)="getBooksByStatus(statusSelect.value)">confirm</button>
      </div>
      <ng-container *ngIf="(books$ | async) as books">
        <table mat-table [dataSource]="books.content">
          <ng-container matColumnDef="title">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('title')">Title</a></th>
            <td mat-cell *matCellDef="let element">{{ element.title }}</td>
          </ng-container>
          <ng-container matColumnDef="author">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('author')">Author</a></th>
            <td mat-cell *matCellDef="let element">{{ element.author }}</td>
          </ng-container>
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef>Status</th>
            <td mat-cell *matCellDef="let element">{{ element.status }}</td>
          </ng-container>
          <ng-container matColumnDef="details">
            <th mat-header-cell *matHeaderCellDef>Details</th>
            <td mat-cell *matCellDef="let element"><button [routerLink]="element.id">See details</button></td>
          </ng-container>
          <ng-container matColumnDef="favorite">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let element">
            <span (click)="toggleFavorite(element.id); $event.stopPropagation()"
                  style="cursor:pointer">
              {{ favoritesService.isFavorite(element.id) ? '★' : '☆' }}
            </span>
          </td>
        </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <button *ngIf="hasPrevious()" (click)="back()">Back</button>
        <button *ngIf="hasNext()" (click)="next()">Next</button>
        <button (click)="reset()">Reset</button>
        <button (click)="toggleFavoritesFilter()">
          {{ showingFavorites ? 'Show all' : '★ Favorites' }}
        </button>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
