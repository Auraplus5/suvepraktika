<div class="container mat-elevation-z4">
  <mat-card>
    <mat-card-title>Checkouts</mat-card-title>
    <mat-card-content>
      <ng-container *ngIf="(checkouts$ | async) as checkouts">
        <table mat-table [dataSource]="checkouts.content">
          <ng-container matColumnDef="name">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('borrowerFirstName')">Name</a></th>
            <td mat-cell *matCellDef="let element">{{ element.borrowerFirstName }} {{element.borrowerLastName}}</td>
          </ng-container>
          <ng-container matColumnDef="borrowedBook">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('borrowedBook')">Borrowed book</a></th>
            <td mat-cell *matCellDef="let element">{{ element.borrowedBook.title }}</td>
          </ng-container>
          <ng-container matColumnDef="checkedOutDate">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('checkedOutDate')">Checked out date</a></th>
            <td mat-cell *matCellDef="let element">{{element.checkedOutDate}}</td>
          </ng-container>
          <ng-container matColumnDef="dueDate">
            <th mat-header-cell *matHeaderCellDef><a (click)="sort('dueDate')">Due Date</a></th>
            <td mat-cell *matCellDef="let element">{{element.dueDate}}</td>
          </ng-container>
          <ng-container matColumnDef="details">
            <th mat-header-cell *matHeaderCellDef>Details</th>
            <td mat-cell *matCellDef="let element"><button [routerLink]="element.id">Details</button></td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
        </table>
        <button *ngIf="hasPrevious()" (click)="previous()">Back</button>
        <button *ngIf="hasNext()" (click)="next()">Next</button>
        <button (click)="reset()">Reset</button>
      </ng-container>
    </mat-card-content>
  </mat-card>
</div>
