<div>
    <mat-card>
        <mat-card-title>Book information</mat-card-title><br>
        <mat-card-content>
            <ng-container *ngIf="(book$ | async) as book">
                <p>ID: {{book.id}}</p>
                <p>Title: {{book.title}}</p>
                <p>Author: {{book.author}}</p>
                <p>Genre: {{book.genre}}</p>
                <p>Year: {{book.year}}</p>
                <p>Added: {{book.added}}</p>
                <p>Check out count: {{book.checkOutCount}}</p>
                <p>Status: {{book.status}}</p>
                <p *ngIf="book.dueDate">Due date: {{book.dueDate}}</p>
                <button (click)="return()">Return</button>
            </ng-container>
        </mat-card-content>
    </mat-card>
</div>
